<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>疾病照護認證時程儀表板（主管版）</title>

<!-- PWA 設定：讓網頁可以「加入主畫面」變成類似 App 的圖示 -->
<link rel="manifest" href="manifest-supervisor.json">
<meta name="theme-color" content="#9c2f5e">
<link rel="apple-touch-icon" href="icon-supervisor-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="認證儀表板(主管)">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --navy:#9c2f5e;
    --navy-2:#c14f7a;
    --teal:#a8791f;
    --teal-light:#f7ecd9;
    --topbar-bg:#FFD4D4;
    --paper:#f7f5f3;
    --card:#ffffff;
    --ink:#1a2733;
    --ink-soft:#5b6b76;
    --line:#e4ddd5;

    --c-grey:#8a97a0;
    --c-grey-bg:#eef1f2;
    --c-orange:#c9820f;
    --c-orange-bg:#fdf1dd;
    --c-red:#c23b3b;
    --c-red-bg:#fbe7e7;
    --c-blue:#2563aa;
    --c-blue-bg:#e2edf9;
    --c-maroon:#7a1f2b;
    --c-maroon-bg:#f3dbdd;
    --c-green:#2f7d5a;
    --c-green-bg:#e4f1ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
  }
  .topbar{
    background:var(--topbar-bg);
    color:var(--navy);
    padding:20px clamp(16px,4vw,40px) 28px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(168,121,31,0.18), transparent 70%);
  }
  .topbar-logo-row{
    display:flex;
    align-items:center;
    margin-bottom:14px;
    position:relative;
  }
  .topbar-logo-row img{
    height:36px;
    width:auto;
    display:block;
  }
  .topbar h1{
    margin:0 0 4px 0;
    font-size:clamp(24px,3vw,30px);
    font-weight:700;
    letter-spacing:0.5px;
    position:relative;
    color:#1a1a1a;
  }
  .topbar .sub{
    font-size:17px;
    color:#3a3a3a;
    position:relative;
  }
  .topbar .today{
    display:inline-block;
    margin-top:10px;
    background:rgba(0,0,0,0.06);
    border:1px solid rgba(0,0,0,0.15);
    color:#1a1a1a;
    padding:5px 14px;
    border-radius:20px;
    font-size:16.5px;
    position:relative;
  }
  .topbar .updated-badge{
    margin-left:8px;
  }
  .lock-bar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    max-width:1200px;
    margin:14px auto 0;
    padding:0 clamp(12px,3vw,24px);
  }
  .lock-status{
    font-size:16px;
    color:var(--ink-soft);
  }
  .lock-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--navy);
    font-size:16.5px;
    font-weight:700;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .lock-btn:hover{border-color:var(--teal);color:var(--teal);}
  .lock-btn.unlocked{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  input[type=date][disabled]{
    border-color:transparent;
    background:transparent;
    color:var(--ink);
    -webkit-text-fill-color:var(--ink);
    opacity:1;
    padding-left:0;
    cursor:default;
  }
  input[type=date][disabled]::-webkit-calendar-picker-indicator{
    display:none;
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:20px clamp(12px,3vw,24px) 60px;
  }

  /* custom passcode modal (native prompt() is blocked in the sandboxed artifact iframe) */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(18,41,63,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:24px 26px;
    width:min(320px, 90vw);
    box-shadow:0 10px 30px rgba(18,41,63,0.25);
  }
  .modal-box h3{
    margin:0 0 6px;
    font-size:19px;
    color:var(--navy);
  }
  .modal-box p{
    margin:0 0 14px;
    font-size:16.5px;
    color:var(--ink-soft);
  }
  .modal-box input[type=password]{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    font-size:18px;
    margin-bottom:8px;
    box-sizing:border-box;
  }
  .modal-box input[type=password]:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  .modal-error{
    font-size:16px;
    color:var(--c-red);
    min-height:16px;
    margin-bottom:6px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
  .modal-actions button{
    border:none;
    border-radius:8px;
    padding:8px 16px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }
  .modal-cancel{ background:var(--c-grey-bg); color:var(--ink-soft); }
  .modal-confirm{ background:var(--teal); color:#fff; }

  /* summary panel */
  .summary{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:24px;
    box-shadow:0 1px 3px rgba(18,41,63,0.06);
  }
  .summary h2{
    margin:0 0 12px;
    font-size:19px;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .summary h2.collapsible-heading{
    cursor:pointer;
    user-select:none;
  }
  .summary h2.collapsible-heading:hover{ opacity:0.8; }
  .section-arrow{
    margin-left:auto;
    color:var(--ink-soft);
    font-size:14px;
    font-weight:400;
    transition:transform 0.2s ease;
  }
  .section-arrow.collapsed{ transform:rotate(180deg); }
  .summary h2 .dot{
    width:8px;height:8px;border-radius:50%;background:var(--c-red);display:inline-block;
  }
  .alert-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .alert-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border-radius:8px;
    font-size:17px;
    border-left:4px solid transparent;
  }
  .alert-row.urgent{background:var(--c-orange-bg);border-left-color:var(--c-orange);color:#7a5a0e;}
  .alert-row.overdue{background:var(--c-maroon-bg);border-left-color:var(--c-maroon);color:var(--c-maroon);}
  .alert-row.reminder{background:var(--c-blue-bg);border-left-color:var(--c-blue);color:var(--c-blue);}
  .alert-group-label{
    font-size:15.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin:14px 0 4px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .alert-group-label:first-child{margin-top:0;}
  .alert-row .tag{
    font-weight:700;
    font-size:15px;
    padding:2px 8px;
    border-radius:10px;
    background:rgba(0,0,0,0.08);
    white-space:nowrap;
  }
  .alert-empty{
    color:var(--ink-soft);
    font-size:17px;
    padding:6px 2px;
  }

  /* 主管版新增區塊樣式 */
  #alertCounts{
    font-size:15px;
    font-weight:400;
    color:var(--ink-soft);
    margin-left:6px;
  }
  #alertCounts b{ font-weight:700; }
  #compCounts{
    font-size:15px;
    font-weight:400;
    color:var(--ink-soft);
    margin-left:6px;
  }
  #compCounts b{ font-weight:700; color:var(--navy); }
  .comp-summary-hint{ font-style:italic; }
  .recent-done-block{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .recent-done-title{
    font-size:14.5px;
    font-weight:700;
    color:var(--c-green);
    margin-bottom:8px;
  }
  .recent-done-row{
    font-size:15px;
    color:var(--ink-soft);
    padding:4px 0;
  }
  .recent-done-row b{ color:var(--ink); font-weight:700; }

  .status-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:12px;
  }
  .stat-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .stat-card .num{
    font-size:30px;
    font-weight:800;
    color:var(--navy);
    line-height:1.1;
  }
  .stat-card .label{
    font-size:15px;
    color:var(--ink-soft);
    margin:2px 0 8px;
  }
  .stat-card .names{
    font-size:14.5px;
    color:var(--ink);
    line-height:1.6;
  }

  .forecast-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .forecast-row{
    display:flex;
    gap:12px;
    align-items:baseline;
    padding:8px 12px;
    background:var(--paper);
    border-radius:8px;
    border-left:4px solid var(--navy);
  }
  .forecast-row .period{
    font-weight:700;
    color:var(--navy);
    font-size:16px;
    white-space:nowrap;
    min-width:110px;
  }
  .forecast-row .names{
    font-size:15.5px;
    color:var(--ink);
  }

  .comparison-note{
    font-size:14.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
    line-height:1.6;
  }
  .comp-lock-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    margin-bottom:14px;
  }
  .comp-lock-status{
    font-size:13px;
    color:var(--ink-soft);
  }
  .comp-lock-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--navy);
    font-size:12.5px;
    font-weight:700;
    padding:5px 12px;
    border-radius:14px;
    cursor:pointer;
    white-space:nowrap;
  }
  .comp-lock-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .comp-lock-btn.unlocked{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  .comp-region-grid{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .comp-region-block{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .comp-region-title{
    font-size:16.5px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:2px solid var(--teal);
  }
  .comp-region-count{
    font-weight:400;
    color:var(--ink-soft);
    font-size:14px;
    margin-left:2px;
  }
  .comp-empty{
    color:var(--ink-soft);
    font-size:14.5px;
    text-align:center;
    padding:10px 0 !important;
  }
  .comparison-note a{ color:var(--teal); }
  .comp-table{
    width:100%;
    border-collapse:collapse;
    font-size:16px;
  }
  .comp-table th{
    text-align:left;
    font-size:14px;
    color:var(--ink-soft);
    font-weight:700;
    padding:6px 8px;
    border-bottom:1px solid var(--line);
  }
  .comp-table td{
    padding:6px 8px;
    border-bottom:1px solid var(--line);
  }
  .comp-table input[type=text]{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 8px;
    font-size:15.5px;
    font-family:inherit;
    box-sizing:border-box;
  }
  .comp-table input[type=number]{
    width:90px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 8px;
    font-size:15.5px;
    font-family:inherit;
  }
  .comp-row-del{
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:16px;
  }
  .comp-row-del:hover{ color:var(--c-red); }
  .comp-add-btn{
    margin-top:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--teal);
    font-weight:700;
    font-size:15px;
    padding:6px 14px;
    border-radius:16px;
    cursor:pointer;
  }
  .comp-add-btn:hover{ border-color:var(--teal); }

  /* legend */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:20px;
    font-size:16px;
    color:var(--ink-soft);
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .collapse-toggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:16px;
    font-size:17px;
    font-weight:700;
    color:var(--navy);
    cursor:pointer;
    box-shadow:0 1px 3px rgba(18,41,63,0.06);
  }
  .collapse-toggle:hover{ border-color:var(--teal); }
  .collapse-toggle .arrow{
    color:var(--ink-soft);
    transition:transform 0.2s ease;
    font-size:14px;
  }
  .collapse-toggle .arrow.collapsed{
    transform:rotate(180deg);
  }
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* cards */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(360px,1fr));
    gap:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px 16px;
    box-shadow:0 1px 3px rgba(18,41,63,0.06);
    position:relative;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .updated-label{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:4px 0 12px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .card-head .name{
    font-size:20px;
    font-weight:700;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-head .idx{
    font-size:15px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border-radius:6px;
    padding:2px 7px;
  }
  .card-head-right{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .name-input{
    font-size:20px;
    font-weight:700;
    color:var(--navy);
    border:1px solid var(--line);
    border-radius:7px;
    padding:3px 8px;
    font-family:inherit;
    max-width:180px;
  }
  .name-input:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  .del-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:15px;
    border-radius:8px;
    padding:4px 9px;
    cursor:pointer;
    white-space:nowrap;
  }
  .del-btn:hover{ border-color:var(--c-red); color:var(--c-red); }
  .del-btn.confirm{
    background:var(--c-red-bg);
    border-color:var(--c-red);
    color:var(--c-red);
    font-weight:700;
  }
  .mini-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:700;
    border-radius:16px;
    padding:3px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .mini-btn:hover:not(:disabled){ border-color:var(--teal); color:var(--teal); }
  .mini-btn.done{
    background:var(--c-green-bg);
    border-color:var(--c-green);
    color:var(--c-green);
  }
  .mini-btn:disabled{ opacity:0.55; cursor:default; }
  .field{
    display:grid;
    grid-template-columns:100px 1fr;
    gap:8px;
    align-items:center;
    padding:6px 0;
  }
  .field.range{
    display:grid;
    grid-template-columns:1fr 16px 1fr;
    grid-template-rows:auto auto;
    column-gap:8px;
    row-gap:4px;
    padding:6px 0;
  }
  .field.range label{
    grid-column:1 / -1;
    grid-row:1;
  }
  .field.range input[type=date]:nth-of-type(1){
    grid-column:1;
    grid-row:2;
  }
  .field.range .sep{
    grid-column:2;
    grid-row:2;
  }
  .field.range input[type=date]:nth-of-type(2){
    grid-column:3;
    grid-row:2;
  }
  .field label{
    font-size:16.5px;
    color:var(--ink-soft);
  }
  .field input[type=date]{
    width:100%;
    min-width:0;
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 7px;
    font-size:16.5px;
    font-family:inherit;
    color:var(--ink);
    background:#fbfcfc;
    box-sizing:border-box;
  }
  .field input[type=date]:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  .sep{color:var(--ink-soft);text-align:center;font-size:16px;}

  .status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:2px;
  }
  .badge{
    font-size:15px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .b-grey{background:var(--c-grey-bg);color:var(--c-grey);}
  .b-orange{background:var(--c-blue-bg);color:var(--c-blue);}
  .b-red{background:var(--c-orange-bg);color:var(--c-orange);}
  .b-maroon{background:var(--c-maroon-bg);color:var(--c-maroon);}
  .b-green{background:var(--c-green-bg);color:var(--c-green);}

  .section-title{
    font-size:15.5px;
    color:var(--teal);
    font-weight:700;
    letter-spacing:0.5px;
    margin:14px 0 2px;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .recalc-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
    letter-spacing:0;
    text-transform:none;
    border-radius:14px;
    padding:3px 9px;
    cursor:pointer;
    white-space:nowrap;
  }
  .recalc-btn:hover:not(:disabled){ border-color:var(--teal); color:var(--teal); }
  .recalc-btn:disabled{ opacity:0.5; cursor:default; }
  .remark-box{
    width:100%;
    min-height:60px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:#fbfcfc;
    resize:vertical;
    box-sizing:border-box;
  }
  .remark-box:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  .remark-box:disabled{
    background:transparent;
    border-color:transparent;
    color:var(--ink);
    opacity:1;
    resize:none;
    padding-left:0;
  }
  .note-row{
    margin-top:4px;
    font-size:15.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .flag{
    font-size:15px;
    background:#eef1f2;
    color:var(--ink-soft);
    padding:1px 7px;
    border-radius:8px;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);
    color:#fff;
    padding:9px 18px;
    border-radius:24px;
    font-size:17px;
    opacity:0;
    transition:all .25s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .footer-note{
    text-align:center;
    color:var(--ink-soft);

function fmtToday(){
  const y=today.getFullYear(), m=String(today.getMonth()+1).padStart(2,'0'), d=String(today.getDate()).padStart(2,'0');
  return `${y}.${m}.${d}`;
}

function parseDate(str){
  if(!str) return null;
  const d = new Date(str + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return d;
}
function daysUntil(str){
  const d = parseDate(str);
  if(!d) return null;
  return Math.round((d - today)/MS_DAY);
}
function fmtDisplay(str){
  if(!str) return '（空白）';
  const [y,m,d] = str.split('-');
  return `${y}.${m}.${d}`;
}

// 今天的日期字串（YYYY-MM-DD）
function todayStr(){

}

// 標記某個項目「今天有更新過」

// 往前推一個月（處理月底天數不同的情況，例如 3/31 往前一個月會落在 2 月最後一天）
function subtractOneMonth(dateStr){
  const d = parseDate(dateStr);
  if(!d) return '';
  const day = d.getDate();
  const target = new Date(d.getFullYear(), d.getMonth()-1, 1);
  const daysInTargetMonth = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
  target.setDate(Math.min(day, daysInTargetMonth));
  return `${target.getFullYear()}-${pad(target.getMonth()+1)}-${pad(target.getDate())}`;
}

// 往後加 N 個月（處理月底天數不同的情況）
function addMonths(dateStr, n){
  const d = parseDate(dateStr);
  if(!d) return '';
  const day = d.getDate();
  const target = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const daysInTargetMonth = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
  target.setDate(Math.min(day, daysInTargetMonth));
  return `${target.getFullYear()}-${pad(target.getMonth()+1)}-${pad(target.getDate())}`;
}

// 找出「前一週的星期一」：先找出當週星期一，再往前推 7 天
function mondayOfPrevWeek(dateStr){
  const d = parseDate(dateStr);
  if(!d) return '';
  const dow = d.getDay(); // 0=週日, 1=週一, ..., 6=週六
  const diffToThisMonday = (dow === 0) ? 6 : dow - 1;
  const thisMonday = new Date(d);
  thisMonday.setDate(d.getDate() - diffToThisMonday);
  thisMonday.setDate(thisMonday.getDate() - 7);
  return `${thisMonday.getFullYear()}-${pad(thisMonday.getMonth()+1)}-${pad(thisMonday.getDate())}`;
}

// 申請認證時間：統一以「截止前一個月（30天）」作為提醒門檻，
// 若已按下「申請完成」則直接視為完成，不再提醒
// 共用的提醒燈號邏輯：截止前1個月進入提醒（橘），前2週進入緊急（紅），
// 逾期未處理（暗紅），已標記完成則直接視為完成（綠）
function reminderStatus(dateStr, done){
  if(done) return {level:'green', label:'已完成'};
  if(!dateStr) return {level:'grey', label:'未設定'};
  const remain = daysUntil(dateStr);
  if(remain === null) return {level:'grey', label:'未設定'};
  if(remain < 0) return {level:'maroon', label:`已逾期 ${Math.abs(remain)} 天，請確認`};
  if(remain <= 14) return {level:'red', label:`緊急・剩 ${remain} 天`};
  if(remain <= 30) return {level:'orange', label:`提醒中・剩 ${remain} 天`};
  return {level:'grey', label:`尚未提醒・剩 ${remain} 天`};
}

// 申請認證時間：以截止日（applyEnd）為準
function applyStatus(startStr, endStr, done){
  if(!startStr || !endStr) return {level:'grey', label:'未設定'};
  return reminderStatus(endStr, done);
}

// 3/15/27個月改善追蹤
function trackStatus(dateStr, done){

let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);

function pad(n){ return String(n).padStart(2,'0'); }
function toICSDate(str){ // 'YYYY-MM-DD' -> 'YYYYMMDD'
  return str.replace(/-/g,'');
}
function addDaysToDateStr(str, days){
  const d = parseDate(str);
  d.setDate(d.getDate()+days);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}
function icsEscape(str){
  return String(str).replace(/([,;])/g,'\\$1');
}

function buildVEvent(uid, dateStr, summary, description, alarms){
  const dtStart = toICSDate(dateStr);
  const dtEnd = addDaysToDateStr(dateStr, 1); // 全天事件，結束日為隔天
  const now = new Date();
  const dtStamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}T${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}Z`;
  let ev = [
    'BEGIN:VEVENT',
    `UID:${uid}@cert-dashboard`,
    `DTSTAMP:${dtStamp}`,
    `DTSTART;VALUE=DATE:${dtStart}`,
    `DTEND;VALUE=DATE:${dtEnd}`,
    `SUMMARY:${icsEscape(summary)}`,
    `DESCRIPTION:${icsEscape(description)}`,
  ];
  alarms.forEach(days=>{
    ev.push('BEGIN:VALARM');
    ev.push(`TRIGGER:-P${days}D`);
    ev.push('ACTION:DISPLAY');
    ev.push(`DESCRIPTION:${icsEscape(summary)}`);
    ev.push('END:VALARM');
  });
  ev.push('END:VEVENT');
  return ev.join('\r\n');
}

function exportICS(){
  const events = [];
  items.forEach((it, idx)=>{
    // 申請認證期間開始：當天提醒（開始受理）
    if(it.applyStart && !it.applyDone){
      events.push(buildVEvent(
        `apply-start-${idx}`,
        it.applyStart,
        `【${it.name}】申請認證期間開始`,
        `${it.name} 申請認證期間自今日開始，至 ${fmtDisplay(it.applyEnd)} 截止。`,
        [0]
      ));
    }
    // 申請認證截止：統一提前1個月提醒（已標記「申請完成」的不匯出）
    if(it.applyEnd && !it.applyDone){
      events.push(buildVEvent(
        `apply-end-${idx}`,
        it.applyEnd,
        `【${it.name}】申請認證截止日`,
        `${it.name} 申請認證將於今日截止，請確認送件狀態。`,
        [30, 14, 0]
      ));
    }
    // 改善追蹤：統一提前1個月提醒（已標記完成的不匯出）
    [['3個月改善追蹤', it.t3, it.t3Done], ['15個月改善追蹤', it.t15, it.t15Done], ['27個月改善追蹤', it.t27, it.t27Done]].forEach(([label, val, done], j)=>{
      if(!val || done) return;
      events.push(buildVEvent(
        `track-${idx}-${j}`,
        val,
        `【${it.name}】${label}到期`,
        `${it.name} ${label}將於今日到期，請確認辦理狀態。`,
        [30, 14, 0]
      ));
    });
    // 所有資料繳交／簡報繳交：統一提前1個月提醒（已標記完成的不匯出）
    [['所有資料繳交', it.docSubmit, it.docSubmitDone, 'doc'], ['簡報繳交', it.presentSubmit, it.presentSubmitDone, 'present']].forEach(([label, val, done, key])=>{
      if(!val || done) return;
      events.push(buildVEvent(
        `${key}-${idx}`,
        val,
        `【${it.name}】${label}`,
        `${it.name} ${label}將於今日到期。`,
        [30, 14, 0]
      ));
    });
  });

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//cert-dashboard//zh-TW//',
    'CALSCALE:GREGORIAN',
    ...events,
    'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '認證提醒行事曆.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已下載日曆檔，請匯入 Google/Outlook/Apple 行事曆');
}

function renderAlerts(){
  const overdueRows = [];  // maroon 已逾期
  const urgentRows = [];   // red 緊急（前2週）
  const reminderRows = []; // orange 提醒中（前1個月）

  function classify(level, row){
    if(level === 'maroon') overdueRows.push(row);
    else if(level === 'red') urgentRows.push(row);
    else if(level === 'orange') reminderRows.push(row);
  }

  items.forEach((it,idx)=>{
    const aStat = applyStatus(it.applyStart, it.applyEnd, it.applyDone);
    if(aStat.level === 'maroon'){
      classify('maroon', {tag:'申請截止', text:`${it.name}：申請認證已逾期（原訂 ${fmtDisplay(it.applyEnd)} 截止，${aStat.label}），請確認送件狀態`});
    } else if(aStat.level === 'red'){
      classify('red', {tag:'申請截止', text:`${it.name}：申請認證即將截止（${fmtDisplay(it.applyEnd)}），${aStat.label}`});
    } else if(aStat.level === 'orange'){
      classify('orange', {tag:'申請中', text:`${it.name}：申請認證期間（${fmtDisplay(it.applyStart)} – ${fmtDisplay(it.applyEnd)}）即將截止，${aStat.label}`});
    }
    [['3個月',it.t3,it.t3Done],['15個月',it.t15,it.t15Done],['27個月',it.t27,it.t27Done]].forEach(([label,val,done])=>{
      if(!val || done) return;
      const st = trackStatus(val, done);
      if(st.level === 'maroon'){
        classify('maroon', {tag:label+'追蹤', text:`${it.name}：${label}改善追蹤已逾期（原訂 ${fmtDisplay(val)}，${st.label}），請確認辦理狀態`});
      } else if(st.level === 'red'){
        classify('red', {tag:label+'追蹤', text:`${it.name}：${label}改善追蹤即將到期（${fmtDisplay(val)}），${st.label}`});
      } else if(st.level === 'orange'){
        classify('orange', {tag:label+'追蹤', text:`${it.name}：${label}改善追蹤將於 ${fmtDisplay(val)} 到期，${st.label}`});
      }
    });
    [['所有資料繳交', it.docSubmit, it.docSubmitDone], ['簡報繳交', it.presentSubmit, it.presentSubmitDone]].forEach(([label, val, done])=>{
      if(!val || done) return;
      const st = submitStatus(val, done);
      if(st.level === 'maroon'){
        classify('maroon', {tag:label, text:`${it.name}：${label}已逾期（原訂 ${fmtDisplay(val)}，${st.label}）`});
      } else if(st.level === 'red'){
        classify('red', {tag:label, text:`${it.name}：${label}即將到期（${fmtDisplay(val)}），${st.label}`});
      } else if(st.level === 'orange'){
        classify('orange', {tag:label, text:`${it.name}：${label}將於 ${fmtDisplay(val)} 到期，${st.label}`});
      }
    });
  });

  const list = document.getElementById('alertList');
  const countsEl = document.getElementById('alertCounts');
  if(countsEl){
    countsEl.innerHTML = `（逾期 <b>${overdueRows.length}</b> 個・緊急 <b>${urgentRows.length}</b> 個・提醒中 <b>${reminderRows.length}</b> 個）`;
  }
  if(overdueRows.length === 0 && urgentRows.length === 0 && reminderRows.length === 0){
    list.innerHTML = `<div class="alert-empty">目前沒有進行中、緊急或逾期的項目 👍</div>`;
  } else {
    function renderGroup(label, cls, rows){
      if(rows.length === 0) return '';
      return `<div class="alert-group-label">${label}</div>` + rows.map(r=>`
        <div class="alert-row ${cls}">
          <span class="tag">${r.tag}</span>
          <span>${r.text}</span>
        </div>`).join('');
    }
    let html = '';
    html += renderGroup('🟤 已逾期，請優先處理', 'overdue', overdueRows);
    html += renderGroup('🟠 緊急（2週內）', 'urgent', urgentRows);
    html += renderGroup('🔵 提醒中（1個月內）', 'reminder', reminderRows);
    list.innerHTML = html;
  }
  renderRecentDone();
}

// 近期完成：掃描所有已標記完成的項目，依最後更新日期排序，顯示最近的紀錄
function renderRecentDone(){
  const block = document.getElementById('recentDoneBlock');
  if(!block) return;
  const doneFields = [
    ['applyDone', '申請認證'],
    ['docSubmitDone', '所有資料繳交'],
    ['presentSubmitDone', '簡報繳交'],
    ['t3Done', '3個月改善追蹤'],
    ['t15Done', '15個月改善追蹤'],
    ['t27Done', '27個月改善追蹤'],
  ];
  let rows = [];
  items.forEach(it=>{
    doneFields.forEach(([field, label])=>{
      if(it[field]){
        rows.push({ name: it.name, label, date: it.updatedAt || '' });
      }
    });
  });
  rows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  rows = rows.slice(0, 8);
  if(rows.length === 0){
    block.innerHTML = `<div class="recent-done-title">🟢 近期完成</div><div class="alert-empty">目前尚無標記完成的項目</div>`;
    return;
  }
  block.innerHTML = `<div class="recent-done-title">🟢 近期完成（最近 ${rows.length} 筆）</div>` +
    rows.map(r=>`<div class="recent-done-row"><b>${r.name}</b>：${r.label} 已完成${r.date ? '（' + fmtDisplay(r.date) + '）' : ''}</div>`).join('');
}

// 目前各疾病執行狀況：效期內／申請中／準備實地訪視
function renderStatusStats(){
  const el = document.getElementById('statusStats');
  if(!el) return;

  const inCert = [];    // 目前效期內
  const applying = [];  // 申請中
  const preVisit = [];  // 準備實地訪視（尚未到訪視日）

  items.forEach(it=>{
    if(it.certStart && it.certEnd){
      const s = parseDate(it.certStart), e = parseDate(it.certEnd);
      if(s && e && today >= s && today <= e){ inCert.push(it.name); }
    }
    if(it.applyStart && it.applyEnd && !it.applyDone){
      const s = parseDate(it.applyStart), e = parseDate(it.applyEnd);
      if(s && e && today >= s && today <= e){ applying.push(it.name); }
    }
    if(it.visit){
      const v = parseDate(it.visit);
      if(v && v >= today){ preVisit.push(it.name); }
    }
  });

  function card(title, list){
    return `<div class="stat-card">
      <div class="num">${list.length}</div>
      <div class="label">${title}</div>
      <div class="names">${list.length ? list.join('、') : '（無）'}</div>
    </div>`;
  }

  el.innerHTML =
    card('目前效期內的疾病別', inCert) +
    card('申請認證中的疾病別', applying) +
    card('準備實地訪視的疾病別', preVisit);
}

// 預計再次申請時間：以目前申請認證起始日 + 3年 推算下一輪申請時間，並依月份標記上/下半年
function renderForecast(){
  const el = document.getElementById('forecastList');
  if(!el) return;

  const groups = {}; // { '2028年上半年': [name, ...] }
  items.forEach(it=>{
    if(!it.applyStart) return;
    const nextStart = addMonths(it.applyStart, 36); // 3年 = 36個月
    const d = parseDate(nextStart);
    if(!d) return;
    const year = d.getFullYear();
    const half = (d.getMonth()+1) <= 6 ? '上半年' : '下半年';
    const label = `${year}年${half}`;
    if(!groups[label]) groups[label] = [];
    groups[label].push(it.name);
  });

  const labels = Object.keys(groups).sort();
  if(labels.length === 0){
    el.innerHTML = `<div class="alert-empty">目前沒有可推算的申請認證資料</div>`;
    return;
  }
  el.innerHTML = labels.map(label=>`
    <div class="forecast-row">
      <span class="period">${label}</span>
      <span class="names">${groups[label].join('、')}</span>
    </div>`).join('');
}

// 其他醫院疾病別認證通過量比較（手動輸入，因原始網站為動態網頁無法自動抓取）
const REGION_LIST = ['北區', '中區', '南區', '高屏區', '東區'];
let compEditMode = false; // 「其他醫院比較」是否解鎖編輯，預設鎖定僅供查看

function toggleCompEditMode(){
  if(compEditMode){
    compEditMode = false;
    renderComparison();
    showToast('已鎖定「其他醫院比較」');
    return;
  }
  openCompPassModal();
}

function openCompPassModal(){
  const modal = document.getElementById('compPassModal');
  const input = document.getElementById('compPassInput');
  const error = document.getElementById('compPassError');
  error.textContent = '';
  input.value = '';
  modal.classList.add('show');
  setTimeout(()=>input.focus(), 50);
}

function closeCompPassModal(){
  document.getElementById('compPassModal').classList.remove('show');
}

function submitCompPasscode(){
  const input = document.getElementById('compPassInput');
  const error = document.getElementById('compPassError');
  if(input.value === EDITOR_PASSCODE){
    compEditMode = true;
    closeCompPassModal();
    renderComparison();
    showToast('已解鎖「其他醫院比較」編輯');
  } else {
    error.textContent = '密碼錯誤，請再試一次';
    input.value = '';
    input.focus();
  }
}



function renderComparison(){
  const el = document.getElementById('comparisonBlock');
  if(!el) return;
  const rows = comparison.hospitals || [];
  const dis = compEditMode ? '' : 'disabled';

  // 計算跟「本院」相比，其他醫院多於／低於／持平的家數，以及總共輸入了幾家醫院
  const countsEl = document.getElementById('compCounts');
  if(countsEl){
    const totalText = `共輸入 <b>${rows.length}</b> 家醫院`;
    const updatedText = comparison.updatedAt ? `・最後更新 <b>${fmtDisplay(comparison.updatedAt)}</b>` : '・尚無更新紀錄';
    const home = rows.find(h => (h.name||'').trim() === '本院');
    if(!home){
      countsEl.innerHTML = `（${totalText}${updatedText}・<span class="comp-summary-hint">請先輸入名稱為「本院」的資料，才能顯示比較</span>）`;
    } else {
      const homeCount = Number(home.count) || 0;
      let more = 0, less = 0, equal = 0;
      rows.forEach(h=>{
        if(h === home) return;
        const c = Number(h.count) || 0;
        if(c > homeCount) more++;
        else if(c < homeCount) less++;
        else equal++;
      });
      countsEl.innerHTML = `（${totalText}${updatedText}・本院 <b>${homeCount}</b> 項・多於本院 <b>${more}</b> 家・低於本院 <b>${less}</b> 家・持平 <b>${equal}</b> 家）`;
    }
  }

  function regionSection(region){
    // 找出屬於這個分區的醫院（用原始陣列的 index，才能正確更新/刪除）
    const rowIdxs = [];
    rows.forEach((h, i)=>{ if((h.region || '未分區') === region) rowIdxs.push(i); });

    const rowsHtml = rowIdxs.map(i=>{
      const h = rows[i];
      return `
      <tr>
        <td><input type="text" value="${(h.name||'').replace(/"/g,'&quot;')}" ${dis} onchange="updateCompField(${i},'name',this.value)" placeholder="醫院名稱"></td>
        <td><input type="number" value="${h.count ?? ''}" ${dis} onchange="updateCompField(${i},'count',this.value)" placeholder="0"></td>
        <td>${compEditMode ? `<button class="comp-row-del" onclick="removeCompRow(${i})">🗑</button>` : ''}</td>
      </tr>`;
    }).join('');

    return `
    <div class="comp-region-block">
      <div class="comp-region-title">
        <span>${region}<span class="comp-region-count">（${rowIdxs.length}）</span></span>
      </div>
      <table class="comp-table">
        <thead><tr><th>醫院</th><th>通過疾病別數</th><th></th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="3" class="comp-empty">尚未輸入</td></tr>`}</tbody>
      </table>
      ${compEditMode ? `<button class="comp-add-btn" onclick="addCompRow('${region}')">➕ 新增${region}醫院</button>` : ''}
    </div>`;
  }

  // 相容沒有分區資訊的舊資料，額外顯示一個「未分區」區塊
  const hasUnassigned = rows.some(h => !h.region || !REGION_LIST.includes(h.region));

  el.innerHTML = `
    <div class="comparison-note">
      💡 此區塊資料需<b>手動輸入</b>——原始查詢頁面（<a href="${comparison.sourceUrl}" target="_blank" rel="noopener">醫策會通過機構查詢系統</a>）是動態網頁，系統無法自動抓取，請自行查詢後填入下方數字，填完會自動存檔。
    </div>
    <div class="comp-lock-row">
      <span class="comp-lock-status">${compEditMode ? '🔓 編輯模式・修改會自動存檔' : '🔒 已鎖定・僅供查看'}</span>
      <button class="comp-lock-btn ${compEditMode ? 'unlocked' : ''}" onclick="toggleCompEditMode()">${compEditMode ? '鎖定' : '🔒 解鎖編輯'}</button>
    </div>
    <div class="comp-region-grid">
      ${REGION_LIST.map(regionSection).join('')}
      ${hasUnassigned ? regionSection('未分區') : ''}
    </div>
  `;
}

function updateCompField(i, field, value){
  if(!compEditMode) return;
  if(!comparison.hospitals[i]) return;
  comparison.hospitals[i][field] = field === 'count' ? Number(value) : value;
  comparison.updatedAt = todayStr();
  saveComparison();
  renderComparison(); // 重新渲染以更新畫面上的「最後更新」文字
}

function addCompRow(region){
  if(!compEditMode) return;
  comparison.hospitals.push({name:'', count:0, region: region || '未分區'});
  comparison.updatedAt = todayStr();
  renderComparison();
  saveComparison();
}

function removeCompRow(i){
  if(!compEditMode) return;
  comparison.hospitals.splice(i,1);
  comparison.updatedAt = todayStr();
  renderComparison();
  saveComparison();
}

function saveComparison(){
  backendSet(JSON.stringify({items, comparison})).then(()=>{
    showToast('已儲存比較資料');
  }).catch(()=>{
    showToast('儲存失敗，請檢查網路');
  });
}

let alertCollapsed = false;
function toggleAlertBlock(){
  alertCollapsed = !alertCollapsed;
  const block = document.getElementById('alertContent');
  const arrow = document.getElementById('alertArrow');
  block.style.display = alertCollapsed ? 'none' : 'block';
  arrow.classList.toggle('collapsed', alertCollapsed);
}

let comparisonCollapsed = false;
function toggleComparisonBlock(){
  comparisonCollapsed = !comparisonCollapsed;
  const block = document.getElementById('comparisonBlock');
  const arrow = document.getElementById('comparisonArrow');
  block.style.display = comparisonCollapsed ? 'none' : 'block';
  arrow.classList.toggle('collapsed', comparisonCollapsed);
}

let cardGridCollapsed = false;
function toggleCardGrid(){
  cardGridCollapsed = !cardGridCollapsed;
  const grid = document.getElementById('cardGrid');
  const arrow = document.getElementById('cardGridArrow');
  grid.style.display = cardGridCollapsed ? 'none' : 'grid';
  arrow.classList.toggle('collapsed', cardGridCollapsed);
}

function renderAll(){
  document.getElementById('cardGrid').innerHTML = items.map((it,idx)=>renderCard(it,idx)).join('');
  renderAlerts();
  renderStatusStats();
  renderForecast();
  renderComparison();
  const sub = document.getElementById('subLabel');
  if(sub){ sub.textContent = `${items.length} 項疾病別認證追蹤・申請認證期限與改善追蹤自動提醒`; }
  updateLastUpdatedBadge();
}

// 找出所有項目裡最新的「最後更新」日期，顯示在頁面最上方
function updateLastUpdatedBadge(){
  const badge = document.getElementById('lastUpdatedBadge');
  if(!badge) return;
  let latest = '';
  let names = [];
  items.forEach(it=>{
    if(!it.updatedAt) return;
    if(it.updatedAt > latest){
      latest = it.updatedAt;
      names = [it.name];
    } else if(it.updatedAt === latest){
      names.push(it.name);
    }
  });
  if(!latest){
    badge.textContent = '📝 資料尚無更新紀錄';
    return;
  }
  const namesText = names.length > 2 ? `${names.slice(0,2).join('、')} 等 ${names.length} 項` : names.join('、');
  badge.textContent = `📝 資料最後更新：${fmtDisplay(latest)}（${namesText}）`;
}

async function loadData(){
  try{
    const valueStr = await backendGet();
    if(valueStr){
      const parsed = JSON.parse(valueStr);
      if(Array.isArray(parsed)){
        // 舊格式：直接是 items 陣列，沒有 comparison 資料，沿用預設值
        items = parsed;
      } else {
        items = parsed.items || [];
        if(parsed.comparison){ comparison = parsed.comparison; }
      }
    } else {
      items = defaultItems;
      await backendSet(JSON.stringify({items, comparison}));
    }
  }catch(e){
    items = defaultItems;
    showToast('無法連線到資料庫，暫時顯示預設資料');
  }
  // 相容舊資料：如果資料裡還沒有「所有資料繳交」「簡報繳交」欄位，
  // 就依現有的實地訪視日期自動補上預設值（之後仍可手動調整）
  let backfilled = false;
  items.forEach(it=>{
    if(it.docSubmit === undefined){
      it.docSubmit = it.visit ? subtractOneMonth(it.visit) : '';
      backfilled = true;
    }
    if(it.presentSubmit === undefined){
      it.presentSubmit = it.visit ? mondayOfPrevWeek(it.visit) : '';
      backfilled = true;
    }
    if(it.docSubmitDone === undefined){
      it.docSubmitDone = false;
      backfilled = true;
    }
    if(it.presentSubmitDone === undefined){
      it.presentSubmitDone = false;
      backfilled = true;
    }
    if(it.applyDone === undefined){
      it.applyDone = false;
      backfilled = true;
    }
    if(it.remark === undefined){
      it.remark = '';
      backfilled = true;
    }
    if(it.t3Done === undefined){
      it.t3Done = false;
      backfilled = true;
    }
    if(it.t15Done === undefined){
      it.t15Done = false;
      backfilled = true;
    }
    if(it.t27Done === undefined){
      it.t27Done = false;
      backfilled = true;
    }
    if(it.updatedAt === undefined){
      it.updatedAt = ''; // 舊資料沒有紀錄過，先留空，之後一有異動就會自動填入
      backfilled = true;
    }
  });
  if(backfilled){
    try{ await backendSet(JSON.stringify({items, comparison})); }catch(e){}
  }
}

async function init(){
  await loadData();
  renderAll();
}

init();
</script>
